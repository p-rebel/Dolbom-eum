name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          PYTHONUTF8: '1'

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env && npm ci --no-audit --no-fund && npm run build

  deploy:
    # main에 들어간 커밋만 EC2로 배포. SSH 포트를 열지 않고 SSM Run Command로 서버에서 deploy/setup.sh 실행
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      IID: ${{ vars.EC2_INSTANCE_ID }}
      HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run deploy/setup.sh on EC2
        run: |
          set -euo pipefail
          CMD="set -e; git -C /opt/dolbomeum fetch -q origin && git -C /opt/dolbomeum show $GITHUB_SHA:deploy/setup.sh > /root/dolbomeum-setup.sh && bash /root/dolbomeum-setup.sh $GITHUB_SHA $HOST"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --timeout-seconds 600 \
            --parameters "$(jq -nc --arg c "$CMD" '{commands:[$c],executionTimeout:["1200"]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"
          # aws ssm wait는 100초에서 끊겨 빌드 시간을 못 버티므로 직접 폴링 (최대 20분)
          for _ in $(seq 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue;; *) break;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output text | tail -c 4000
          [ "$STATUS" = Success ]
      - name: Health check
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "https://$HOST/api/v1/health"
